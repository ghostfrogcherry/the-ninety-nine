# =============================================================================
# ninetynine — self-hosted MTG collection + deck builder.
#
# Deploys alongside an existing arr stack. Its own bridge network;
# nothing here joins media-net.
#
# PORTS: a typical arr stack already publishes 3000 (homepage), 5055 (jellyseerr),
# 6767 (bazarr), 7878 (radarr), 8080 (qbittorrent), 8096 (jellyfin),
# 8686 (lidarr), 8989 (sonarr) and 9696 (prowlarr). This stack uses 3010,
# chosen to miss all of them. Postgres is deliberately NOT published — it is
# reachable only from the compose network.
#
# Validate with `docker compose config --quiet` before deploying, same as the
# media stack.
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: ninetynine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ninetynine}
      POSTGRES_USER: ${POSTGRES_USER:-ninetynine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      # Applied in filename order on FIRST init only — an existing ./data/db
      # is left untouched. Later schema changes go through the `migrate`
      # profile below.
      #
      # db/migrations/zzz_record_baseline.sh rides along in the same directory,
      # sorts after every NNNN_*.sql, and records what they just applied, so a
      # fresh database starts with a populated schema_migrations rather than a
      # schema the runner cannot tell apart from seven migrations behind.
      #
      # It lives IN this directory rather than being mounted on top of it. A
      # file bind-mounted inside a read-only directory bind mount makes Docker
      # create the mount point in the read-only parent, which fails on first
      # boot with "read-only file system" — or, on some setups, leaves an empty
      # stub file behind in the host's db/migrations.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - ninetynine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ninetynine} -d ${POSTGRES_DB:-ninetynine}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ninetynine-app:local
    container_name: ninetynine-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ninetynine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ninetynine}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set — generate with `openssl rand -base64 32`}
      # Auth.js v5 builds callback URLs from this. Wrong value = redirect loops
      # on sign-in that look like a broken login form.
      AUTH_URL: ${AUTH_URL:-http://localhost:3010}
      AUTH_TRUST_HOST: "true"
      SCRYFALL_DATA_DIR: /data/scryfall
      TZ: ${TZ:-America/Chicago}
    volumes:
      # The bulk mirror (~500MB). A NAMED volume, deliberately, not a bind
      # mount: Docker creates a missing bind-mount directory as root while the
      # container runs as uid 1001, so the refresh dies with EACCES on its
      # first download. A named volume inherits ownership from the image (see
      # the mkdir/chown in the Dockerfile) and just works.
      - scryfall-data:/data/scryfall
    ports:
      # Bound to the Tailscale IP by default rather than 0.0.0.0 — with Caddy
      # (see docker-compose.proxy.yml) set APP_BIND=127.0.0.1 instead.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3010}:3000"
    networks:
      - ninetynine

  # Weekly Scryfall bulk refresh. Runs the same image as the app, but as a
  # one-shot command instead of the server. `restart: no` so a failed refresh
  # does not hot-loop against Scryfall — exactly the hammering to avoid.
  scryfall-refresh:
    image: ninetynine-app:local
    container_name: ninetynine-scryfall-refresh
    profiles: ["refresh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ninetynine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ninetynine}
      SCRYFALL_DATA_DIR: /data/scryfall
      TZ: ${TZ:-America/Chicago}
    volumes:
      - scryfall-data:/data/scryfall
    command: ["node", "scripts/refresh-scryfall.mjs"]
    networks:
      - ninetynine

  # Schema migrations. `/docker-entrypoint-initdb.d` only ever runs on first
  # init, so this is how every change after the first deploy gets applied.
  #
  #   docker compose --profile migrate run --rm migrate
  #   docker compose --profile migrate run --rm migrate --status
  #
  # `restart: no` for the same reason as the refresh: a migration that fails
  # should stop and be read, not hot-loop against the database.
  migrate:
    image: ninetynine-app:local
    container_name: ninetynine-migrate
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ninetynine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ninetynine}
      TZ: ${TZ:-America/Chicago}
    entrypoint: ["node", "scripts/migrate.mjs"]
    networks:
      - ninetynine

  # Backups. Runs the POSTGRES image, not the app image: pg_dump has to match
  # the server version it dumps, and the app image is node:22-alpine with no
  # Postgres client in it at all.
  #
  #   docker compose --profile backup run --rm backup
  #   docker compose --profile backup run --rm backup --keep=30 --no-mirror
  #
  # The dump is written to a temporary name and renamed only after it has been
  # restored into a scratch database and its row counts compared against the
  # live one, so a dump that cannot be restored is never left looking like one
  # that can.
  backup:
    image: postgres:17-alpine
    container_name: ninetynine-backup
    profiles: ["backup"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ninetynine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ninetynine}
      BACKUP_DIR: /backups
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./data/backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - ninetynine

  # Restore. Same profile, same image, deliberately a separate service so that
  # `--profile backup run --rm backup` can never restore by accident.
  #
  #   docker compose stop app
  #   docker compose --profile backup run --rm restore --list
  #   docker compose --profile backup run --rm restore --file=ninetynine-….dump
  #   docker compose start app
  restore:
    image: postgres:17-alpine
    container_name: ninetynine-restore
    profiles: ["backup"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ninetynine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ninetynine}
      BACKUP_DIR: /backups
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./data/backups:/backups
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/restore.sh"]
    networks:
      - ninetynine

volumes:
  scryfall-data:

networks:
  ninetynine:
    driver: bridge
